name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: png, POSTGRES_PASSWORD: png, POSTGRES_DB: png }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U png" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://png:png@localhost:5432/png
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      PROVIDER_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
